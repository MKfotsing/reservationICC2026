spring.application.name=reservations-springboot
spring.application.frontend-url=http://localhost:8080

# Charge les identifiants locaux (fichier ignoré par Git)
spring.config.import=optional:file:src/main/.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/reservations?autoReconnect=true&useSSL=false&serverTimezone=Europe/Brussels

# Valeurs de repli après ":" si la variable d'environnement n'est pas définie
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate ddl auto (create, create-drop, validate, update)
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true

# Enable use of hidden input to override HTML method in form (put & delete)
spring.mvc.hiddenmethod.filter.enabled=true

# Dev
spring.thymeleaf.cache=false

# Email configuration
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true