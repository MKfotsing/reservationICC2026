<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layouts/main}">
    <head>
        <title>Connexion</title>
    </head>
    <body>
        <div layout:fragment="content">
            <h2 class="mb-4">Connexion</h2>

            <div th:if="${param.loginRequired}" class="alert alert-info">
                Veuillez vous connecter pour accéder à cette page.
            </div>
            <div th:if="${param.logoutSuccess}" class="alert alert-success">
                Vous avez été déconnecté.
            </div>
            <div th:if="${param.loginError}" class="alert alert-danger">
                Login ou mot de passe incorrect.
            </div>

            <form th:action="@{/login}" method="post">
                <div>
                    <label>Login :</label>
                    <input type="text" name="login" maxlength="60" required autofocus>
                </div>
                <div>
                    <label>Password :</label>
                    <input type="password" name="password" maxlength="60" required>
                </div>
                <div>
                    <label><input type="checkbox" name="remember-me"> Se souvenir de moi</label>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary mt-4">Se connecter</button>
                </div>
            </form>
        </div>
    </body>
</html>
