<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
            xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="utf-8">
    <title>Header fragment</title>
  </head>
  <body>
    <header class="navbar navbar-inverse navbar-fixed-top" th:fragment="header">
      <div class="container">
        <div class="navbar-header">
          <h1><a class="navbar-brand" href="#">Réservations</a></h1>
        </div>
        <div class="navbar-collapse collapse">
          <ul class="nav navbar-nav">
            <li th:classappend="${module == 'home' ? 'active' : ''}">
              <a href="#" th:href="@{/}">Accueil</a>
            </li>
            <li th:classappend="${module == 'artists' ? 'active' : ''}">
              <a href="#" th:href="@{/artists}">Nos artistes</a>
            </li>
            <li sec:authorize="!isAuthenticated() or hasRole('ADMIN')">
              <a href="#" th:href="@{/admin}">Administration</a>
            </li>
          </ul>
        </div>
	<div style="float:right">
	        <div sec:authorize="!isAuthenticated()">
	            <p>Vous n'êtes pas connecté.</p>
	            <p><a th:href="@{/forgot-password}">Réinitialiser le mot de passe</a></p>
	            <p><a th:href="@{/login}" class="nav-link">Se connecter</a></p>
	            <p><a th:href="@{/register}" class="nav-link">S'inscrire</a></p>
	        </div>
                 <div sec:authorize="isAuthenticated()">
		<p>Bonjour <span sec:authentication="principal.username">Bob</span>!</p>
    <p><a th:href="@{/profile}">Mon profil</a></p>
    <p><a th:href="@{/profile?edit}">Modifier le mot de passe</a></p>
		<form th:action="@{/logout}" method="post" class="nav-link">
	    <button class="unset">Se déconnecter</button>
	</form>
	    </div>

        </div>
      </div>
    </header>
  </body>
</html>
